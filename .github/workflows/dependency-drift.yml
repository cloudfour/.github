name: Dependency drift

# Reports dependency changes that are on the default branch but not in the
# version of the package published on npm. Anyone installing the package gets
# the published version, so these changes reach users only after a release.
# See the README for the caller workflow each repository needs.

on:
  workflow_call:

jobs:
  drift:
    name: Check for unreleased dependency changes
    runs-on: ubuntu-latest
    # The caller has to grant these too; a called workflow can't raise them.
    permissions:
      contents: read
      issues: write
    # Two runs at once could each find no issue and both open one.
    concurrency:
      group: dependency-drift-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const LABEL = 'unreleased dependencies';
            const MARKER = '<!-- dependency-drift -->';
            const FIELDS = ['dependencies', 'optionalDependencies', 'peerDependencies'];
            const { owner, repo } = context.repo;
            const branch = process.env.GITHUB_REF_NAME;

            let pkg;
            try {
              const { data } = await github.rest.repos.getContent({
                owner,
                repo,
                path: 'package.json',
                ref: context.sha,
              });
              pkg = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
            } catch (error) {
              if (error.status !== 404) throw error;
              core.notice('There is no package.json at the repository root, so there is nothing to compare.');
              return;
            }
            if (pkg.private) {
              core.notice(`${pkg.name} is private, so nothing is published to compare against.`);
              return;
            }

            // The `latest` tag is what a plain `npm install` resolves to.
            const response = await fetch(
              `https://registry.npmjs.org/${pkg.name.replace('/', '%2f')}/latest`,
            );
            if (response.status === 404) {
              core.notice(`${pkg.name} has not been published to npm yet.`);
              return;
            }
            if (!response.ok) {
              throw new Error(`The npm registry returned ${response.status} for ${pkg.name}.`);
            }
            const published = await response.json();

            const changes = [];
            for (const field of FIELDS) {
              const before = published[field] ?? {};
              const after = pkg[field] ?? {};
              const names = [...new Set([...Object.keys(before), ...Object.keys(after)])].sort();
              for (const name of names) {
                if (before[name] !== after[name]) {
                  changes.push({ field, name, before: before[name], after: after[name] });
                }
              }
            }

            // An exact version, or a `^` or `~` range on one such as `^17.12.0`,
            // which is how Renovate writes the ranges the `library` preset keeps.
            // Anything else, such as `^1 || ^2` or `>=1 <3`, can't be compared
            // without a semver library, so those rows show as `range`.
            const SIMPLE = /^\s*(=|[~^])?\s*v?(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?\s*$/;
            const parse = (value) => {
              const match = SIMPLE.exec(value ?? '');
              if (!match) return undefined;
              const [, operator = '', major, minor, patch, prerelease] = match;
              return {
                operator: operator === '=' ? '' : operator,
                parts: [major, minor, patch].map(Number),
                prerelease,
                version: `${major}.${minor}.${patch}${prerelease ? `-${prerelease}` : ''}`,
              };
            };

            const upstreamChange = ({ before, after }) => {
              if (before === undefined) return 'added';
              if (after === undefined) return 'removed';
              const from = parse(before);
              const to = parse(after);
              if (!from || !to || from.operator !== to.operator) return 'range';
              const index = from.parts.findIndex((part, i) => part !== to.parts[i]);
              if (index !== -1) return ['major', 'minor', 'patch'][index];
              // Same version written differently, such as `v1.2.3` and `1.2.3`.
              return from.prerelease === to.prerelease ? 'none' : 'prerelease';
            };

            // npmdiff.dev only accepts a scoped name with the `@` and `/` encoded.
            const whatChanged = ({ name, before, after }) => {
              const from = parse(before);
              const to = parse(after);
              if (from && to && from.version !== to.version) {
                return `[diff](https://npmdiff.dev/${encodeURIComponent(name)}/${from.version}/${to.version}/)`;
              }
              const version = (to ?? from)?.version;
              return `[npm](https://www.npmjs.com/package/${name}${version ? `/v/${version}` : ''})`;
            };

            for (const change of changes) change.upstream = upstreamChange(change);

            // Pipes in a range such as `^1 || ^2` would split a table cell.
            const cell = (value) =>
              value === undefined ? '_none_' : `\`${String(value).replaceAll('|', '\\|')}\``;
            const table = [
              `| Field | Package | ${published.version} on npm | On \`${branch}\` | Upstream change | What changed |`,
              '| --- | --- | --- | --- | --- | --- |',
              ...changes.map(
                (change) =>
                  `| \`${change.field}\` | \`${change.name}\` | ${cell(change.before)} | ${cell(change.after)} | ${change.upstream} | ${whatChanged(change)} |`,
              ),
            ].join('\n');

            // The suggestion only sets a floor. Version numbers can't show how
            // this package uses a dependency: a minor bump to a shared config
            // can add error-level rules, which makes it a major release here.
            const breakingReason = (change) => {
              if (change.field === 'peerDependencies') {
                return 'changes a peer dependency, which changes what projects must install alongside this one';
              }
              if (change.upstream === 'removed') {
                return 'is removed, and projects may be using it without depending on it themselves';
              }
              if (change.upstream === 'major') {
                return 'is a major upstream release';
              }
              return undefined;
            };
            const breaking = changes.filter(breakingReason);
            const unassessed = changes.filter(
              (change) => change.upstream === 'range' && !breaking.includes(change),
            );
            const suggestion = [
              '### Suggested release',
              '',
              ...(breaking.length > 0
                ? [
                    'Start from **major**, because of:',
                    '',
                    ...breaking.map((change) => `- \`${change.name}\` ${breakingReason(change)}`),
                    '',
                    "This comes from the version numbers alone. If you've checked that none of these reach users, a smaller release may be enough.",
                  ]
                : [
                    'Start from **patch or minor**, depending on whether users see a difference.',
                    '',
                    'This comes from the version numbers alone, so treat it as a floor. A minor upstream release can still need a major here if it changes what users see, such as a shared config adding error-level rules.',
                  ]),
              ...(unassessed.length > 0
                ? [
                    '',
                    `Check these by hand, since their ranges can't be compared automatically: ${unassessed.map((change) => `\`${change.name}\``).join(', ')}.`,
                  ]
                : []),
            ].join('\n');

            const NOUNS = {
              dependencies: 'dependency',
              optionalDependencies: 'optional dependency',
              peerDependencies: 'peer dependency',
            };
            const bullet = ({ field, name, before, after, upstream }) => {
              if (upstream === 'added') return `- Adds \`${name}\` \`${after}\` as a ${NOUNS[field]}.`;
              if (upstream === 'removed') return `- Removes the \`${name}\` ${NOUNS[field]}.`;
              const subject = field === 'dependencies' ? `\`${name}\`` : `The \`${name}\` ${NOUNS[field]}`;
              return `- ${subject} moves from \`${before}\` to \`${after}\`.`;
            };
            // A code block, so the bullets copy as Markdown instead of rendered text.
            const changelog = [
              '### Draft changelog',
              '',
              'Add a sentence to each bullet saying what it means for users.',
              '',
              '```md',
              ...changes.map(bullet),
              '```',
            ].join('\n');

            // Only the default branch maintains the issue. A run on any other
            // branch, such as a manual run while testing, just reports.
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            if (branch !== repository.default_branch) {
              await core.summary
                .addRaw(
                  changes.length === 0
                    ? `\`${branch}\` matches ${pkg.name}@${published.version} on npm.`
                    : [table, suggestion, changelog].join('\n\n'),
                )
                .write();
              core.notice(
                `${changes.length} unreleased dependency change(s) on ${branch}. Only the default branch, ${repository.default_branch}, opens or updates an issue.`,
              );
              return;
            }

            const { data: open } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: LABEL,
              per_page: 100,
            });
            const existing = open.find((issue) => !issue.pull_request && issue.body?.includes(MARKER));

            if (changes.length === 0) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body: `The dependencies on \`${branch}\` now match ${pkg.name}@${published.version} on npm, so there's nothing left to release.`,
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                core.info(`Closed #${existing.number}.`);
              } else {
                core.info(`${branch} matches ${pkg.name}@${published.version} on npm.`);
              }
              return;
            }

            const versionNote =
              pkg.version === published.version
                ? ''
                : `\n\`package.json\` is at ${pkg.version}, which isn't on npm's \`latest\` tag yet. If that release is in progress, this issue will close itself once it's published.\n`;
            const title = `Unreleased dependency changes since ${published.version}`;
            const body = `${MARKER}
            \`${branch}\` has dependency changes that aren't in the published package. Anyone installing \`${pkg.name}\` gets ${published.version}, the version on npm's \`latest\` tag, so these changes reach users only after a release.

            ${table}
            ${versionNote}
            ${suggestion}

            ${changelog}

            Publish a release to ship these, or leave this open if they're waiting to go out with other changes. This issue updates as more changes land, and closes itself once npm matches \`${branch}\`.

            <sub>Maintained by the [dependency drift check](https://github.com/cloudfour/.github#dependency-drift-check).</sub>
            `;

            if (existing) {
              if (existing.title === title && existing.body === body) {
                core.info(`#${existing.number} is already up to date.`);
                return;
              }
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, title, body });
              core.info(`Updated #${existing.number}.`);
              return;
            }

            try {
              await github.rest.issues.getLabel({ owner, repo, name: LABEL });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: LABEL,
                color: 'fbca04',
                description: "Dependency changes on the default branch that npm doesn't have yet",
              });
            }
            const { data: created } = await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: [LABEL],
            });
            core.info(`Opened #${created.number}.`);
