name: Dependency drift

# Reports dependency changes that are on the default branch but not in the
# version of the package published on npm. Anyone installing the package gets
# the published version, so these changes reach users only after a release.
# See the README for the caller workflow each repository needs.

on:
  workflow_call:

jobs:
  drift:
    name: Check for unreleased dependency changes
    runs-on: ubuntu-latest
    # The caller has to grant these too; a called workflow can't raise them.
    permissions:
      contents: read
      issues: write
    # Two runs at once could each find no issue and both open one.
    concurrency:
      group: dependency-drift-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const LABEL = 'unreleased dependencies';
            const MARKER = '<!-- dependency-drift -->';
            const FIELDS = ['dependencies', 'optionalDependencies', 'peerDependencies'];
            const { owner, repo } = context.repo;
            const branch = process.env.GITHUB_REF_NAME;

            let pkg;
            try {
              const { data } = await github.rest.repos.getContent({
                owner,
                repo,
                path: 'package.json',
                ref: context.sha,
              });
              pkg = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
            } catch (error) {
              if (error.status !== 404) throw error;
              core.notice('There is no package.json at the repository root, so there is nothing to compare.');
              return;
            }
            if (pkg.private) {
              core.notice(`${pkg.name} is private, so nothing is published to compare against.`);
              return;
            }

            // The `latest` tag is what a plain `npm install` resolves to.
            const response = await fetch(
              `https://registry.npmjs.org/${pkg.name.replace('/', '%2f')}/latest`,
            );
            if (response.status === 404) {
              core.notice(`${pkg.name} has not been published to npm yet.`);
              return;
            }
            if (!response.ok) {
              throw new Error(`The npm registry returned ${response.status} for ${pkg.name}.`);
            }
            const published = await response.json();

            const changes = [];
            for (const field of FIELDS) {
              const before = published[field] ?? {};
              const after = pkg[field] ?? {};
              const names = [...new Set([...Object.keys(before), ...Object.keys(after)])].sort();
              for (const name of names) {
                if (before[name] !== after[name]) {
                  changes.push({ field, name, before: before[name], after: after[name] });
                }
              }
            }

            // Pipes in a range such as `^1 || ^2` would split a table cell.
            const cell = (value) =>
              value === undefined ? '_none_' : `\`${String(value).replaceAll('|', '\\|')}\``;
            const table = [
              `| Field | Package | ${published.version} on npm | On \`${branch}\` |`,
              '| --- | --- | --- | --- |',
              ...changes.map(
                (change) =>
                  `| \`${change.field}\` | \`${change.name}\` | ${cell(change.before)} | ${cell(change.after)} |`,
              ),
            ].join('\n');

            // Only the default branch maintains the issue. A run on any other
            // branch, such as a manual run while testing, just reports.
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            if (branch !== repository.default_branch) {
              await core.summary
                .addRaw(
                  changes.length === 0
                    ? `\`${branch}\` matches ${pkg.name}@${published.version} on npm.`
                    : table,
                )
                .write();
              core.notice(
                `${changes.length} unreleased dependency change(s) on ${branch}. Only the default branch, ${repository.default_branch}, opens or updates an issue.`,
              );
              return;
            }

            const { data: open } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: LABEL,
              per_page: 100,
            });
            const existing = open.find((issue) => !issue.pull_request && issue.body?.includes(MARKER));

            if (changes.length === 0) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body: `The dependencies on \`${branch}\` now match ${pkg.name}@${published.version} on npm, so there's nothing left to release.`,
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                core.info(`Closed #${existing.number}.`);
              } else {
                core.info(`${branch} matches ${pkg.name}@${published.version} on npm.`);
              }
              return;
            }

            const versionNote =
              pkg.version === published.version
                ? ''
                : `\n\`package.json\` is at ${pkg.version}, which isn't on npm's \`latest\` tag yet. If that release is in progress, this issue will close itself once it's published.\n`;
            const title = `Unreleased dependency changes since ${published.version}`;
            const body = `${MARKER}
            \`${branch}\` has dependency changes that aren't in the published package. Anyone installing \`${pkg.name}\` gets ${published.version}, the version on npm's \`latest\` tag, so these changes reach users only after a release.

            ${table}
            ${versionNote}
            Publish a release to ship these, or leave this open if they're waiting to go out with other changes. This issue updates as more changes land, and closes itself once npm matches \`${branch}\`.

            <sub>Maintained by the [dependency drift check](https://github.com/cloudfour/.github#dependency-drift-check).</sub>
            `;

            if (existing) {
              if (existing.title === title && existing.body === body) {
                core.info(`#${existing.number} is already up to date.`);
                return;
              }
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, title, body });
              core.info(`Updated #${existing.number}.`);
              return;
            }

            try {
              await github.rest.issues.getLabel({ owner, repo, name: LABEL });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: LABEL,
                color: 'fbca04',
                description: "Dependency changes on the default branch that npm doesn't have yet",
              });
            }
            const { data: created } = await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: [LABEL],
            });
            core.info(`Opened #${created.number}.`);
